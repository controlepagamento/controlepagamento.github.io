<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="same-origin">
<title>Controle de Pagamento</title>
<link rel="icon" href="logo.png">
<script>
// tema salvo neste aparelho (ou o do sistema), aplicado antes de desenhar a página
(function(){var t='dark';try{t=localStorage.getItem('cp_tema')||(matchMedia('(prefers-color-scheme: light)').matches?'light':'dark');}catch(e){}document.documentElement.setAttribute('data-theme',t);})();
function alternarTema(){
  var t=document.documentElement.getAttribute('data-theme')==='light'?'dark':'light';
  document.documentElement.setAttribute('data-theme',t);
  try{localStorage.setItem('cp_tema',t);}catch(e){}
  document.querySelectorAll('.tema-btn').forEach(function(b){b.textContent=t==='light'?'🌙':'☀️';b.title=t==='light'?'Mudar para escuro':'Mudar para claro';});
}
document.addEventListener('DOMContentLoaded',function(){var t=document.documentElement.getAttribute('data-theme');document.querySelectorAll('.tema-btn').forEach(function(b){b.textContent=t==='light'?'🌙':'☀️';b.title=t==='light'?'Mudar para escuro':'Mudar para claro';});});
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.118.0/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg-base:#0e0e0f;--bg-surface:#18181b;--bg-elevated:#232328;--bg-input:#1f1f23;
  --border:rgba(255,255,255,0.08);--border-hover:rgba(255,255,255,0.18);
  --text-primary:#f0f0f0;--text-muted:#8a8a8f;--text-dim:#5a5a60;
  --accent:#e63030;--accent-hover:#c72626;--accent-dim:rgba(230,48,48,0.12);
  --amber:#f59e0b;--amber-dim:rgba(245,158,11,0.15);
  --green:#22c55e;--green-dim:rgba(34,197,94,0.12);
  --blue:#60a5fa;--blue-dim:rgba(96,165,250,0.12);
  --purple:#c084fc;--purple-dim:rgba(168,85,247,0.12);
}
html,body{min-height:100%;background:var(--bg-base);color:var(--text-primary);font-family:'Inter',system-ui,sans-serif;font-size:14px;line-height:1.5}
button{font-family:inherit}

/* ---------- PIN ---------- */
.pin-tela{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px}
.pin-card{width:100%;max-width:360px;background:var(--bg-surface);border:1px solid var(--border);border-radius:16px;padding:32px 28px;display:flex;flex-direction:column;gap:18px;text-align:center}
.logo-badge{background:var(--accent);color:#fff;font-weight:700;font-size:13px;padding:5px 10px;border-radius:6px;letter-spacing:.03em;align-self:center}
.pin-card h1{font-size:18px;font-weight:600}
.pin-card p{color:var(--text-muted);font-size:13px;margin-top:-12px}
.pin-input{width:100%;background:var(--bg-input);border:1px solid var(--border);border-radius:10px;padding:14px;color:var(--text-primary);font-size:28px;font-weight:600;letter-spacing:.5em;text-align:center;outline:none;font-family:ui-monospace,Consolas,monospace;padding-left:calc(14px + .5em)}
.pin-input:focus{border-color:var(--accent)}
.pin-input::placeholder{color:var(--text-dim);letter-spacing:.5em}
.btn{background:var(--bg-elevated);border:1px solid var(--border);border-radius:8px;color:var(--text-primary);padding:9px 16px;cursor:pointer;font-size:13px;font-weight:500;display:inline-flex;align-items:center;justify-content:center;gap:6px;transition:background .15s,border-color .15s}
.btn:hover{border-color:var(--border-hover)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;padding:12px 16px;font-size:14px}
.btn.primary:hover{background:var(--accent-hover)}
.btn:disabled{opacity:.5;cursor:default}
.msg{font-size:13px;color:var(--accent);min-height:1.2em}
.rodape{font-size:12px;color:var(--text-dim)}
.lembrar{display:flex;align-items:center;justify-content:center;gap:8px;font-size:13px;color:var(--text-muted);cursor:pointer}
.lembrar input{width:16px;height:16px;accent-color:var(--accent)}
.pin-card .rot-campo{font-size:12px;color:var(--text-muted);font-weight:600;text-align:left;margin-bottom:-10px}

/* ---------- PAINEL ---------- */
.painel{display:none}
.topbar{background:var(--bg-surface);border-bottom:1px solid var(--border);padding:12px 24px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;position:sticky;top:0;z-index:10}
.logo{display:flex;align-items:center;gap:12px;min-width:0}
.logo-title{font-size:15px;font-weight:600}
.logo-sub{font-size:12px;color:var(--text-muted);overflow:hidden;text-overflow:ellipsis}
.acoes{display:flex;gap:8px}
.conteudo{max-width:1200px;margin:0 auto;padding:20px 24px 48px}
.resumo{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-bottom:18px}
.card{background:var(--bg-surface);border:1px solid var(--border);border-radius:12px;padding:14px 18px}
.card .rot{font-size:10.5px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--text-muted)}
.card .val{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums}
.card .sub{font-size:12px;color:var(--text-muted);font-variant-numeric:tabular-nums}
.card.amber .val{color:var(--amber)}
.card.green .val{color:var(--green)}
.card.red .val{color:var(--accent)}
.obras-tit{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--text-muted);margin-bottom:8px}
.obras{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px;margin-bottom:20px}
.obra-card{background:var(--bg-surface);border:1px solid var(--border);border-radius:12px;padding:12px 14px;text-align:left;cursor:pointer;color:var(--text-primary);display:flex;flex-direction:column;gap:6px;transition:border-color .15s,background .15s}
.obra-card:hover{border-color:var(--border-hover)}
.obra-card.ativa{border-color:var(--accent);background:linear-gradient(0deg,var(--accent-dim),var(--accent-dim)),var(--bg-surface)}
.obra-card .nome{font-size:14px;font-weight:600;line-height:1.3}
.obra-card .linha-info{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:12px;color:var(--text-muted)}
.obra-card .tot{font-size:12px;color:var(--text-muted);font-variant-numeric:tabular-nums}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:600;padding:2px 8px;border-radius:20px;white-space:nowrap}
.pill.pend{background:var(--amber-dim);color:var(--amber)}
.pill.venc{background:var(--accent-dim);color:var(--accent)}
.pill.ok{background:var(--green-dim);color:var(--green)}
.pill.zero{background:var(--bg-elevated);color:var(--text-muted)}
.filtros{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px}
.filtros input,.filtros select{background:var(--bg-elevated);border:1px solid var(--border);border-radius:8px;padding:9px 12px;color:var(--text-primary);font-size:13px;outline:none;font-family:inherit}
.filtros input{flex:1;min-width:200px}
.filtros input:focus,.filtros select:focus{border-color:var(--accent)}
.secao{background:var(--bg-surface);border:1px solid var(--border);border-radius:12px;margin-bottom:16px;overflow:hidden}
.secao-cab{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--border)}
.secao-cab h2{font-size:14px;font-weight:600}
.secao-cab .qtd{font-size:12px;color:var(--text-muted)}
.secao-cab .tot{margin-left:auto;font-size:13px;font-weight:600;font-variant-numeric:tabular-nums}
.vazio{padding:18px;color:var(--text-muted);font-size:13px}
table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:10.5px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--text-muted);padding:10px 14px;border-bottom:1px solid var(--border);white-space:nowrap}
td{padding:10px 14px;border-bottom:1px solid var(--border);font-size:13px;vertical-align:top}
tr:last-child td{border-bottom:none}
td.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
th.num{text-align:right}
td .det{font-size:11.5px;color:var(--text-muted)}
.badge{display:inline-flex;align-items:center;gap:3px;font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:20px;white-space:nowrap}
.badge.sem-oc{background:rgba(120,120,130,0.18);color:#b0b0bc;border:1px solid rgba(160,160,175,0.3)}
.badge.oc-neg{background:rgba(239,68,68,0.15);color:#f87171;border:1px solid rgba(239,68,68,0.35)}
.badge.falta-apr{background:var(--purple-dim);color:var(--purple);border:1px solid rgba(168,85,247,0.35)}
.badge.vinc{background:var(--green-dim);color:var(--green);border:1px solid rgba(34,197,94,0.35)}
.badge.vencido{background:var(--accent-dim);color:var(--accent);border:1px solid rgba(230,48,48,0.35)}
.badge.cinza{background:rgba(120,120,130,0.18);color:#c0c0cc;border:1px solid rgba(180,180,195,0.25)}
.badge.azul{background:var(--blue-dim);color:var(--blue);border:1px solid rgba(96,165,250,0.35)}

/* celular: cada linha vira um cartão */
@media (max-width:760px){
  .topbar{padding:12px 16px}
  .conteudo{padding:16px 16px 40px}
  thead{display:none}
  table,tbody,tr,td{display:block;width:100%}
  tr{padding:12px 16px;border-bottom:1px solid var(--border)}
  tr:last-child{border-bottom:none}
  td{border:none;padding:2px 0;display:flex;justify-content:space-between;gap:12px}
  td::before{content:attr(data-l);font-size:11px;color:var(--text-muted);font-weight:600;text-transform:uppercase;letter-spacing:.04em;flex-shrink:0;padding-top:2px}
  td.num{text-align:right}
  td > div{text-align:right}
}

/* ===== TEMA ESCURO / CLARO + GLASS ===== */
/* --accent = vermelho de alerta (vencido, erro, excluir); --ui = cor de destaque da interface */
:root,:root[data-theme="dark"]{
  color-scheme:dark;
  --bg-base:#0b0c0f;
  --bg-surface:rgba(255,255,255,0.05);
  --bg-elevated:rgba(255,255,255,0.085);
  --bg-input:rgba(0,0,0,0.30);
  --border:rgba(255,255,255,0.10);
  --border-hover:rgba(255,255,255,0.22);
  --text-primary:#f2f3f5;--text-muted:#9a9ca4;--text-dim:#60636b;
  --accent:#ef4444;--accent-hover:#dc2626;--accent-dim:rgba(239,68,68,0.13);
  --ui:#f2f3f5;--ui-hover:#ffffff;--ui-dim:rgba(255,255,255,0.10);--on-ui:#0b0c0f;
  --fundo:
    radial-gradient(900px 620px at 8% -12%, rgba(148,163,184,0.20), transparent 60%),
    radial-gradient(820px 600px at 108% 6%, rgba(100,116,139,0.18), transparent 60%),
    radial-gradient(1000px 720px at 50% 118%, rgba(71,85,105,0.24), transparent 62%),
    #0b0c0f;
  --topbar-bg:rgba(12,13,16,0.60);
  --modal-bg:rgba(24,25,30,0.84);
  --opcao-bg:#16171b;
  --glass-shadow:0 10px 34px rgba(0,0,0,0.38), inset 0 1px 0 rgba(255,255,255,0.06);
}
:root[data-theme="light"]{
  color-scheme:light;
  --bg-base:#eef0f3;
  --bg-surface:rgba(255,255,255,0.62);
  --bg-elevated:rgba(255,255,255,0.85);
  --bg-input:rgba(255,255,255,0.90);
  --border:rgba(15,23,42,0.10);
  --border-hover:rgba(15,23,42,0.24);
  --text-primary:#0f172a;--text-muted:#5b6475;--text-dim:#9aa1ad;
  --accent:#dc2626;--accent-hover:#b91c1c;--accent-dim:rgba(220,38,38,0.10);
  --amber:#b45309;--amber-dim:rgba(217,119,6,0.13);
  --green:#15803d;--green-dim:rgba(22,163,74,0.12);
  --blue:#1d4ed8;--blue-dim:rgba(37,99,235,0.10);
  --purple:#7e22ce;--purple-dim:rgba(147,51,234,0.10);
  --ui:#0f172a;--ui-hover:#1e293b;--ui-dim:rgba(15,23,42,0.07);--on-ui:#ffffff;
  --fundo:
    radial-gradient(900px 620px at 8% -12%, rgba(148,163,184,0.45), transparent 60%),
    radial-gradient(820px 600px at 108% 6%, rgba(203,213,225,0.70), transparent 60%),
    radial-gradient(1000px 720px at 50% 118%, rgba(148,163,184,0.38), transparent 62%),
    #eef0f3;
  --topbar-bg:rgba(255,255,255,0.65);
  --modal-bg:rgba(255,255,255,0.90);
  --opcao-bg:#ffffff;
  --glass-shadow:0 10px 30px rgba(15,23,42,0.08), inset 0 1px 0 rgba(255,255,255,0.7);
}
html{background:var(--bg-base)}
body{background:var(--fundo);background-attachment:fixed;min-height:100vh;color:var(--text-primary)}
.topbar,.sum-card,.envio-card,.info-card,.modal,.login-card,.pin-card,.card,.secao,.obra-card{
  -webkit-backdrop-filter:blur(18px) saturate(150%);
  backdrop-filter:blur(18px) saturate(150%);
  border-color:var(--border);
  box-shadow:var(--glass-shadow);
}
.topbar{background:var(--topbar-bg)}
.modal{background:var(--modal-bg)}
.modal-bg{-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.login-bg,.pin-tela{background:transparent}
select option{background:var(--opcao-bg);color:var(--text-primary)}

/* destaque da interface sem vermelho/roxo */
.btn.primary{background:var(--ui);border-color:var(--ui);color:var(--on-ui)}
.btn.primary:hover{background:var(--ui-hover);border-color:var(--ui-hover)}
.btn.outline-red{border-color:var(--border);color:var(--text-primary)}
.btn.outline-red:hover{background:var(--ui-dim)}
.tab.active{border-bottom-color:var(--ui)}
.chip.active,.form-check.active{background:var(--ui-dim);border-color:var(--ui);color:var(--text-primary)}
.envio-date-badge{background:var(--ui-dim);border-color:var(--border);color:var(--text-primary)}
.obra-card.ativa{border-color:var(--ui);background:linear-gradient(0deg,var(--ui-dim),var(--ui-dim)),var(--bg-surface)}
input:focus,select:focus,textarea:focus,.pin-input:focus{border-color:var(--ui) !important}
.lembrar input,.link-check{accent-color:var(--ui)}
.sum-card.green .value,.card.green .val{color:var(--green)}

/* etiquetas legíveis no tema claro */
:root[data-theme="light"] .badge.material{color:var(--blue);border-color:rgba(37,99,235,0.25)}
:root[data-theme="light"] .badge.cinza,:root[data-theme="light"] .badge.sem-oc{background:rgba(100,116,139,0.12);color:#475569;border-color:rgba(100,116,139,0.30)}
:root[data-theme="light"] .badge.oc-neg{background:var(--accent-dim);color:var(--accent);border-color:rgba(220,38,38,0.30)}

/* botão de tema */
.tema-btn{background:var(--bg-elevated);border:1px solid var(--border);border-radius:8px;color:var(--text-primary);width:38px;height:36px;cursor:pointer;font-size:16px;display:inline-grid;place-items:center;flex-shrink:0}
.tema-btn:hover{border-color:var(--border-hover)}
.tema-flutuante{position:fixed;top:14px;right:14px;z-index:600}

/* logo */
.logo-foto{width:42px;height:42px;border-radius:50%;flex-shrink:0;position:relative;overflow:hidden;display:grid;place-items:center;
  background:linear-gradient(135deg,#475569,#94a3b8);
  box-shadow:0 0 0 2.5px rgba(255,255,255,0.9),0 6px 18px rgba(0,0,0,0.30);
  transform:rotate(-7deg);transition:transform .25s cubic-bezier(.34,1.56,.64,1)}
.logo-foto:hover{transform:rotate(8deg) scale(1.08)}
.logo-foto img{width:100%;height:100%;object-fit:cover;display:block}
.logo-foto span{display:none;font-weight:700;font-size:14px;color:#fff;letter-spacing:.02em}
.logo-foto.sem-foto img{display:none}
.logo-foto.sem-foto span{display:block}
.logo-foto.grande{width:92px;height:92px;align-self:center;animation:balanca 3.2s ease-in-out infinite}
.logo-foto.grande span{font-size:28px}
@keyframes balanca{0%,100%{transform:rotate(-7deg)}50%{transform:rotate(6deg) translateY(-3px)}}
@media (prefers-reduced-motion:reduce){.logo-foto.grande{animation:none}}

/* ===== VIDRO DE VERDADE: formas no fundo + painéis translúcidos ===== */
:root,:root[data-theme="dark"]{
  --forma1:radial-gradient(circle at 30% 30%, #3b82f6, #1e3a8a 70%);
  --forma2:radial-gradient(circle at 60% 40%, #2dd4bf, #0f766e 70%);
  --forma3:radial-gradient(circle at 40% 60%, #94a3b8, #334155 70%);
  --forma-opac:.55;
  --vidro:rgba(255,255,255,0.06);
  --vidro-brilho:linear-gradient(135deg, rgba(255,255,255,0.12), rgba(255,255,255,0.02) 45%, rgba(255,255,255,0.00));
  --vidro-borda:rgba(255,255,255,0.16);
  --vidro-topo:rgba(255,255,255,0.22);
  --topbar-bg:rgba(12,13,16,0.35);
}
:root[data-theme="light"]{
  --forma1:radial-gradient(circle at 30% 30%, #93c5fd, #3b82f6 75%);
  --forma2:radial-gradient(circle at 60% 40%, #99f6e4, #14b8a6 75%);
  --forma3:radial-gradient(circle at 40% 60%, #e2e8f0, #94a3b8 75%);
  --forma-opac:.60;
  --vidro:rgba(255,255,255,0.42);
  --vidro-brilho:linear-gradient(135deg, rgba(255,255,255,0.75), rgba(255,255,255,0.25) 45%, rgba(255,255,255,0.10));
  --vidro-borda:rgba(255,255,255,0.75);
  --vidro-topo:rgba(255,255,255,0.95);
  --topbar-bg:rgba(255,255,255,0.40);
  --bg-elevated:rgba(255,255,255,0.55);
  --bg-input:rgba(255,255,255,0.65);
}
html{background:var(--bg-base)}
body{background:transparent !important}
.fundo-formas{position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none}
.fundo-formas i{position:absolute;border-radius:50%;opacity:var(--forma-opac);filter:blur(8px);will-change:transform}
.fundo-formas i:nth-child(1){width:520px;height:520px;left:-120px;top:-140px;background:var(--forma1);animation:flutua1 26s ease-in-out infinite}
.fundo-formas i:nth-child(2){width:440px;height:440px;right:-100px;top:28%;background:var(--forma2);animation:flutua2 30s ease-in-out infinite}
.fundo-formas i:nth-child(3){width:600px;height:600px;left:30%;bottom:-300px;background:var(--forma3);animation:flutua3 34s ease-in-out infinite}
@keyframes flutua1{0%,100%{transform:translate(0,0)}50%{transform:translate(90px,70px)}}
@keyframes flutua2{0%,100%{transform:translate(0,0)}50%{transform:translate(-80px,60px)}}
@keyframes flutua3{0%,100%{transform:translate(0,0)}50%{transform:translate(60px,-70px)}}
@media (prefers-reduced-motion:reduce){.fundo-formas i{animation:none}}

.topbar,.sum-card,.envio-card,.info-card,.login-card,.pin-card,.card,.secao,.obra-card{
  background-color:var(--vidro) !important;
  background-image:var(--vidro-brilho);
  -webkit-backdrop-filter:blur(22px) saturate(170%);
  backdrop-filter:blur(22px) saturate(170%);
  border:1px solid var(--vidro-borda) !important;
  box-shadow:inset 0 1px 0 var(--vidro-topo), 0 12px 40px rgba(0,0,0,0.22);
}
.topbar{background-color:var(--topbar-bg) !important;border-width:0 0 1px 0 !important}
.obra-card.ativa{background-image:linear-gradient(0deg,var(--ui-dim),var(--ui-dim)),var(--vidro-brilho);border-color:var(--ui) !important}
.modal{-webkit-backdrop-filter:blur(24px) saturate(160%);backdrop-filter:blur(24px) saturate(160%);background-image:var(--vidro-brilho);border:1px solid var(--vidro-borda)}

/* ===== FUNDO EM GRADE (no lugar das bolas) ===== */
:root,:root[data-theme="dark"]{
  --grade-linha:rgba(255,255,255,0.075);
  --grade-forte:rgba(255,255,255,0.13);
  --grade-luz:radial-gradient(ellipse 70% 55% at 50% 0%, rgba(255,255,255,0.09), transparent 70%);
}
:root[data-theme="light"]{
  --grade-linha:rgba(15,23,42,0.07);
  --grade-forte:rgba(15,23,42,0.12);
  --grade-luz:radial-gradient(ellipse 70% 55% at 50% 0%, rgba(255,255,255,0.9), transparent 70%);
}
.fundo-formas i{display:none}
.fundo-formas{
  background:
    var(--grade-luz),
    linear-gradient(var(--grade-forte) 1px, transparent 1px) 0 0 / 160px 160px,
    linear-gradient(90deg, var(--grade-forte) 1px, transparent 1px) 0 0 / 160px 160px,
    linear-gradient(var(--grade-linha) 1px, transparent 1px) 0 0 / 32px 32px,
    linear-gradient(90deg, var(--grade-linha) 1px, transparent 1px) 0 0 / 32px 32px;
  -webkit-mask-image:radial-gradient(ellipse 120% 100% at 50% 30%, #000 55%, transparent 100%);
  mask-image:radial-gradient(ellipse 120% 100% at 50% 30%, #000 55%, transparent 100%);
}

/* ===== RESPOSTAS DO ENGENHEIRO ===== */
[hidden]{display:none !important}
.btn.sm{padding:6px 11px;font-size:12.5px;border-radius:7px}
.btn.sm.primary{padding:6px 12px;font-size:12.5px}
.badge.aguard{background:var(--ui-dim);color:var(--text-muted);border:1px solid var(--border)}
.dica{padding:10px 18px;font-size:12.5px;color:var(--text-muted);border-bottom:1px solid var(--border);background:var(--ui-dim)}
.dica b{color:var(--text-primary)}
td.col-acoes{min-width:280px}
td.col-mini{width:1%;text-align:right}
.acoes-resp{display:flex;gap:6px;flex-wrap:wrap;align-items:center;justify-content:flex-end}
.acao-oc{display:flex;gap:6px}
.oc-input{width:96px;background:var(--bg-input);border:1px solid var(--border);border-radius:7px;padding:6px 9px;color:var(--text-primary);font-size:13px;font-family:inherit;outline:none}
.linha-extra td{padding-top:0;border-top:none}
tr:has(+ .linha-extra:not([hidden])) td{border-bottom:none}
.resp{font-size:12px;color:var(--text-muted);padding:3px 0;display:flex;gap:8px;flex-wrap:wrap;align-items:baseline}
.resp b{color:var(--text-primary);font-weight:600}
.resp .quando{font-size:11px;color:var(--text-dim)}
.st{font-size:10.5px;font-weight:700;padding:1px 7px;border-radius:20px;white-space:nowrap}
.st.wait{background:var(--amber-dim);color:var(--amber)}
.st.ok{background:var(--green-dim);color:var(--green)}
.st.no{background:var(--ui-dim);color:var(--text-muted)}
.resp-admin{flex-basis:100%;color:var(--text-primary);font-size:12.5px;padding-left:20px}
.coment-box,.recado-form{display:flex;gap:8px;align-items:flex-start;flex-wrap:wrap}
.coment-box textarea,.recado-form textarea{flex:1;min-width:220px;background:var(--bg-input);border:1px solid var(--border);border-radius:8px;padding:8px 10px;color:var(--text-primary);font-size:13px;font-family:inherit;outline:none;resize:vertical}
.recado-form{padding:14px 18px}
.sel-obra{background:var(--bg-input);border:1px solid var(--border);border-radius:8px;padding:8px 10px;color:var(--text-primary);font-size:13px;font-family:inherit}
.recado-lista{padding:0 18px 12px}
.recado-item{border-top:1px solid var(--border);padding:8px 0}
.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);opacity:0;pointer-events:none;background:var(--ui);color:var(--on-ui);padding:10px 16px;border-radius:10px;font-size:13.5px;font-weight:600;box-shadow:0 10px 30px rgba(0,0,0,.3);transition:all .2s;z-index:900;max-width:calc(100vw - 32px)}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast.erro{background:var(--accent);color:#fff}
.resumo{grid-template-columns:repeat(auto-fit,minmax(180px,1fr))}
@media (max-width:760px){
  .linha-extra td{display:block}
  .linha-extra td::before{display:none}
  .linha-extra td > div,.linha-extra .resp{text-align:left;justify-content:flex-start}
  td.col-mini{justify-content:flex-end}
  td.col-acoes{min-width:0}
  td.col-acoes::before{padding-top:8px}
  .acoes-resp{justify-content:flex-end}
  .oc-input{width:110px;font-size:16px}
  .coment-box textarea,.recado-form textarea{font-size:16px;min-width:0;flex-basis:100%}
}

/* PRAZO / LOTE / NF */
.prazo{font-size:11px;font-weight:600;margin-top:4px;white-space:nowrap}
.prazo.p-ok{color:var(--text-muted)}
.prazo.p-amber{color:var(--amber)}
.prazo.p-red{color:var(--accent)}
.badge.vence{background:var(--amber-dim);color:var(--amber);border:1px solid rgba(245,158,11,0.35)}
td.lote{white-space:nowrap;color:var(--text-muted);font-size:12px}
.filtros select{max-width:100%}
</style>
</head>
<body>
<div class="fundo-formas" aria-hidden="true"><i></i><i></i><i></i></div>


<!-- TEMA (telas do PIN e do convite) -->
<button class="tema-btn tema-flutuante" id="temaPin" type="button" onclick="alternarTema()">☀️</button>

<!-- ENTRADA POR PIN -->
<div class="pin-tela" id="telaPin">
  <form class="pin-card" onsubmit="entrar(event)">
    <div class="logo-foto grande"><img src="logo.png" alt="" onerror="this.parentNode.classList.add('sem-foto')"><span>CP</span></div>
    <h1>Controle de Pagamento</h1>
    <p>Digite o seu PIN</p>
    <input class="pin-input" id="pin" type="password" inputmode="numeric" autocomplete="current-password" maxlength="12" placeholder="••••••" oninput="this.value=this.value.replace(/\D/g,'')">
    <label class="lembrar"><input type="checkbox" id="lembrar" checked> Lembrar neste aparelho</label>
    <button class="btn primary" id="btnEntrar" type="submit">Entrar</button>
    <div class="msg" id="msg"></div>
    <div class="rodape">Esqueceu o PIN? Peça a Suprimentos um link para criar outro.</div>
  </form>
</div>

<!-- CONVITE: CRIAR O PRÓPRIO PIN -->
<div class="pin-tela" id="telaConvite" style="display:none">
  <form class="pin-card" onsubmit="criarPin(event)">
    <div class="logo-foto grande"><img src="logo.png" alt="" onerror="this.parentNode.classList.add('sem-foto')"><span>CP</span></div>
    <h1 id="convOla">Crie seu PIN</h1>
    <p>Escolha 6 números. É com eles que você vai entrar.</p>
    <div class="rot-campo">Novo PIN</div>
    <input class="pin-input" id="novoPin" type="password" inputmode="numeric" autocomplete="new-password" maxlength="6" placeholder="••••••" oninput="this.value=this.value.replace(/\D/g,'')">
    <div class="rot-campo">Repita o PIN</div>
    <input class="pin-input" id="novoPin2" type="password" inputmode="numeric" autocomplete="new-password" maxlength="6" placeholder="••••••" oninput="this.value=this.value.replace(/\D/g,'')">
    <label class="lembrar"><input type="checkbox" id="lembrarConv" checked> Lembrar neste aparelho</label>
    <button class="btn primary" id="btnCriar" type="submit">Criar PIN e entrar</button>
    <div class="msg" id="msgConv"></div>
  </form>
</div>

<!-- PAINEL DO ENGENHEIRO -->
<div class="painel" id="painel">
  <div class="topbar">
    <div class="logo">
      <div class="logo-foto"><img src="logo.png" alt="" onerror="this.parentNode.classList.add('sem-foto')"><span>CP</span></div>
      <div style="min-width:0">
        <div class="logo-title" id="ola">Olá</div>
        <div class="logo-sub" id="suasObras"></div>
      </div>
    </div>
    <div class="acoes">
      <button class="tema-btn" type="button" onclick="alternarTema()">☀️</button>
      <button class="btn" onclick="atualizar()">↻ Atualizar</button>
      <button class="btn" onclick="sair()">Sair</button>
    </div>
  </div>
  <div class="conteudo">
    <div class="obras-tit">Suas obras</div>
    <div class="obras" id="obras"></div>
    <div class="resumo" id="resumo"></div>
    <div class="filtros">
      <input id="busca" placeholder="Buscar fornecedor, NF, OC..." oninput="desenhar()">
      <select id="fLote" onchange="desenhar()" title="Lote = envio em que a cobrança chegou"><option value="">Todos os lotes</option></select>
    </div>
    <div id="listas"></div>
  </div>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
const cfg = window.MPH_CONFIG || {};
const sb = window.supabase && cfg.supabaseUrl && !/COLE/i.test(cfg.supabaseUrl + cfg.supabaseAnonKey)
  ? window.supabase.createClient(cfg.supabaseUrl, cfg.supabaseAnonKey)
  : null;
const CHAVE_PIN = 'mph_pin';             // PIN lembrado neste aparelho (engenheiro)
const PIN_ADMIN_MIN = 8;                 // PIN com 6 números = engenheiro; com 8 ou mais = administrador
const lerPin = () => { try { return localStorage.getItem(CHAVE_PIN) || sessionStorage.getItem(CHAVE_PIN) || ''; } catch (e) { return ''; } };
function guardarPin(pin, lembrar) {
  try {
    localStorage.removeItem(CHAVE_PIN); sessionStorage.removeItem(CHAVE_PIN);
    if (pin) (lembrar ? localStorage : sessionStorage).setItem(CHAVE_PIN, pin);
  } catch (e) {}
}
const INATIVO_MS = 30 * 60 * 1000;
let dados = null, pinAtual = '', ocupado = false, timerInativo = null;
let obraSel = '';                        // '' = todas as obras
const CHAVE_OBRA = 'mph_obra_sel';
function escolherObra(o) {
  obraSel = o;
  try { localStorage.setItem(CHAVE_OBRA, o); } catch (e) {}
  desenhar();
}

const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const brl = v => 'R$ ' + Number(v || 0).toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const data = d => d ? String(d).slice(0, 10).split('-').reverse().join('/') : '—';
const liquido = i => i.retencao && i.retPct ? Number(i.valor || 0) * (1 - Number(i.retPct) / 100) : Number(i.valor || 0);
const hoje = () => new Date().toISOString().slice(0, 10);
const msg = t => { document.getElementById('msg').textContent = t || ''; };

async function consultar(pin) {
  if (!sb) throw new Error('Página sem configuração. Avise Suprimentos.');
  const { data: r, error } = await sb.rpc('consulta_engenheiro', { p_pin: pin });
  if (error) throw new Error('Não consegui consultar agora. Tente de novo em instantes.');
  return r;
}

async function entrarAdmin(pin) {
  if (!cfg.adminEmail || /COLE/i.test(cfg.adminEmail)) { msg('Acesso de administrador não configurado (config.js).'); return; }
  const { error } = await sb.auth.signInWithPassword({ email: cfg.adminEmail, password: pin });
  if (error) {
    document.getElementById('pin').value = '';
    msg(/rate|many/i.test(error.message) ? 'Muitas tentativas. Aguarde alguns minutos.' : 'PIN não reconhecido.');
    return;
  }
  location.replace('admin.html');
}

async function entrar(ev) {
  if (ev) ev.preventDefault();
  if (ocupado) return;
  const pin = document.getElementById('pin').value.trim();
  if (!/^\d{6}$/.test(pin) && !(pin.length >= PIN_ADMIN_MIN && /^\d+$/.test(pin))) { msg('Digite o seu PIN (6 números).'); return; }
  ocupado = true;
  document.getElementById('btnEntrar').disabled = true;
  msg('');
  try {
    if (pin.length >= PIN_ADMIN_MIN) { await entrarAdmin(pin); return; }
    const r = await consultar(pin);
    if (r.erro === 'bloqueado') { msg('Muitas tentativas erradas. Aguarde 15 minutos.'); document.getElementById('pin').value = ''; return; }
    if (r.erro) { guardarPin(''); msg(r.restantes > 0 ? `PIN não reconhecido. ${r.restantes} tentativa(s) antes do bloqueio.` : 'PIN não reconhecido.'); document.getElementById('pin').value = ''; return; }
    pinAtual = pin;
    guardarPin(pin, document.getElementById('lembrar').checked);
    abrirPainel(r);
  } catch (e) {
    msg(e.message);
  } finally {
    ocupado = false;
    document.getElementById('btnEntrar').disabled = false;
  }
}

function abrirPainel(r) {
  dados = r;
  document.getElementById('telaPin').style.display = 'none';
  document.getElementById('painel').style.display = 'block';
  document.getElementById('temaPin').style.display = 'none';
  document.getElementById('ola').textContent = 'Olá, ' + (r.nome || '').split(' ')[0];
  document.getElementById('suasObras').textContent = (r.obras || []).join(' · ') || 'Nenhuma obra liberada ainda';
  const obras = r.obras || [];
  if (obras.length === 1) obraSel = obras[0];
  else if (!obras.includes(obraSel)) {
    let salva = ''; try { salva = localStorage.getItem(CHAVE_OBRA) || ''; } catch (e) {}
    obraSel = obras.includes(salva) ? salva : '';
  }
  desenhar();
  reiniciarInatividade();
}

function situacao(i) {
  if (i.ocNegativada) return '<span class="badge oc-neg">OC Negativada</span>';
  if (i.semOC) return '<span class="badge sem-oc">Sem OC</span>';
  if (i.faltaApropriacao) return '<span class="badge falta-apr">Falta Apropriação</span>';
  if (i.vinculado) return '<span class="badge vinc">✓ Vinculada</span>';
  return '<span class="badge aguard">⏳ Aguardando</span>';
}
const precisaResolver = i => i.ocNegativada || i.semOC || i.faltaApropriacao;
// dias desde o lote (envio) em que a cobrança chegou
const diasDesde = d => d ? Math.max(0, Math.round((Date.parse(hoje()) - Date.parse(String(d).slice(0, 10))) / 864e5)) : null;
const diasAte = d => d ? Math.round((Date.parse(String(d).slice(0, 10)) - Date.parse(hoje())) / 864e5) : null;
function prazo(i) {
  const d = diasDesde(i.envio);
  if (d == null) return '';
  const cls = d > 14 ? 'p-red' : d > 7 ? 'p-amber' : 'p-ok';
  return `<div class="prazo ${cls}" title="Desde o lote de ${data(i.envio)}">⏱ pendente ${d === 0 ? 'desde hoje' : d === 1 ? 'há 1 dia' : 'há ' + d + ' dias'}</div>`;
}
function venceEm(i) {
  if (i.vinculado || !i.vencimento) return '';
  const d = diasAte(i.vencimento);
  if (d < 0) return ' <span class="badge vencido">vencido</span>';
  if (d <= 5) return ` <span class="badge vence">${d === 0 ? 'vence hoje' : d === 1 ? 'vence amanhã' : 'vence em ' + d + ' dias'}</span>`;
  return '';
}
const aguardando = i => !precisaResolver(i) && !i.vinculado;
const ordemPend = i => i.ocNegativada ? 0 : i.semOC ? 1 : 2;

// ---------- RESPOSTAS (engenheiro → Gustavo) ----------
const respostasDe = id => (dados.respostas || []).filter(r => r.nf_id === id);
const limparOC = v => String(v || '').replace(/^\s*o\.?\s*c\.?\s*(n[ºo°.]?)?\s*/i, '').trim();
const quando = iso => { const d = new Date(iso); return isNaN(d) ? '' : d.toLocaleDateString('pt-BR', { day: '2-digit', month: '2-digit' }) + ' ' + d.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' }); };
const ROTULO = { oc: r => `OC ${esc(r.oc)}`, liberada: () => 'OC liberada', resolvido: () => 'Apropriação feita', comentario: () => 'Comentário' };
function linhaResposta(r) {
  const st = r.status === 'aplicada' ? '<span class="st ok">✓ Gustavo aplicou</span>'
    : r.status === 'descartada' ? '<span class="st no">✕ Gustavo não aplicou</span>'
    : '<span class="st wait">aguardando Gustavo</span>';
  return `<div class="resp">
    <span>📨 <b>${esc(String(r.engenheiro || '').split(' ')[0])}</b>: ${ROTULO[r.tipo] ? ROTULO[r.tipo](r) : ''}${r.texto ? ` — “${esc(r.texto)}”` : ''}</span>
    <span class="quando">${quando(r.criado_em)}</span> ${st}
    ${r.resposta_admin ? `<div class="resp-admin">💬 Gustavo: ${esc(r.resposta_admin)}</div>` : ''}
  </div>`;
}

// o que o engenheiro pode fazer em cada lançamento
function acoes(i) {
  const id = esc(i.id);
  let h = '';
  if (i.temAnexo) h += `<button class="btn sm" data-acao="ver-nf" data-id="${id}" title="Abrir o PDF da NF">📄 NF</button>`;
  if (i.semOC) h += `<div class="acao-oc"><input class="oc-input" data-id="${id}" inputmode="numeric" placeholder="Nº da OC" autocomplete="off">
      <button class="btn sm primary" data-acao="oc" data-id="${id}">Enviar</button></div>`;
  if (i.ocNegativada) h += `<button class="btn sm primary" data-acao="liberada" data-id="${id}">✓ OC liberada</button>`;
  if (i.faltaApropriacao) h += `<button class="btn sm primary" data-acao="resolvido" data-id="${id}">✓ Já apropriei</button>`;
  h += `<button class="btn sm" data-acao="abrir-coment" data-id="${id}" title="Deixar um comentário sobre esta cobrança">💬</button>`;
  return `<div class="acoes-resp">${h}</div>`;
}

function linha(i, comObra, comAcoes) {
  const venc = venceEm(i);
  const ret = i.retencao && i.retPct ? `<div class="det">bruto ${brl(i.valor)} · ret. ${esc(i.retPct)}%</div>` : '';
  const fase = i.fase ? ` <span class="badge ${i.fase === 'Azul' ? 'azul' : 'cinza'}">${esc(i.fase)}</span>` : '';
  const resp = respostasDe(i.id);
  const cols = 8;
  return `<tr data-id="${esc(i.id)}">
    <td data-l="Situação"><div>${situacao(i)}${comAcoes ? prazo(i) : ''}</div></td>
    ${comObra ? `<td data-l="Obra"><div>${esc(i.obra)}${fase}</div></td>` : ''}
    <td data-l="Fornecedor"><div>${esc(i.fornecedor)}${comObra ? '' : fase}</div></td>
    <td data-l="OC">${i.oc ? esc(i.oc) : '—'}</td>
    <td data-l="Documento"><div>${esc(i.tipoDoc || 'NF')} ${esc(i.numDoc || '')}</div></td>
    <td data-l="Vencimento"><div>${data(i.vencimento)}${venc}</div></td>
    <td data-l="Valor" class="num"><div>${brl(liquido(i))}${ret}</div></td>
    <td data-l="Lote" class="lote">${data(i.envio)}</td>
    ${comAcoes ? `<td data-l="Responder" class="col-acoes">${acoes(i)}</td>` : `<td data-l="" class="col-mini"><button class="btn sm" data-acao="abrir-coment" data-id="${esc(i.id)}" title="Deixar um comentário">💬</button></td>`}
  </tr>
  ${resp.length ? `<tr class="linha-extra"><td colspan="${cols + (comObra ? 1 : 0)}">${resp.slice(0, 4).map(linhaResposta).join('')}</td></tr>` : ''}
  <tr class="linha-extra linha-coment" data-coment="${esc(i.id)}" hidden><td colspan="${cols + (comObra ? 1 : 0)}">
    <div class="coment-box"><textarea class="coment-input" data-id="${esc(i.id)}" rows="2" maxlength="1000" placeholder="Escreva para o Gustavo sobre esta cobrança (ex.: ainda não recebi o material, valor errado...)"></textarea>
    <button class="btn sm primary" data-acao="comentario" data-id="${esc(i.id)}">Enviar comentário</button></div>
  </td></tr>`;
}

function tabela(titulo, lista, vazio, comObra, comAcoes, dica) {
  const total = lista.reduce((s, i) => s + liquido(i), 0);
  return `<div class="secao">
    <div class="secao-cab"><h2>${titulo}</h2><span class="qtd">${lista.length} lançamento(s)</span><span class="tot">${brl(total)}</span></div>
    ${dica && lista.length ? `<div class="dica">${dica}</div>` : ''}
    ${lista.length ? `<table>
      <thead><tr><th>Situação</th>${comObra ? '<th>Obra</th>' : ''}<th>Fornecedor</th><th>OC</th><th>Documento</th><th>Vencimento</th><th class="num">Valor</th><th>Lote</th><th>${comAcoes ? 'Responder ao Gustavo' : ''}</th></tr></thead>
      <tbody>${lista.map(i => linha(i, comObra, comAcoes)).join('')}</tbody></table>` : `<div class="vazio">${vazio}</div>`}
  </div>`;
}

// recados gerais da obra (sem lançamento específico)
function secaoRecados(obra) {
  const obras = dados.obras || [];
  const lista = (dados.respostas || []).filter(r => !r.nf_id && (!obra || r.obra === obra)).slice(0, 8);
  const seletor = obra ? `<input type="hidden" id="recadoObra" value="${esc(obra)}">`
    : `<select id="recadoObra" class="sel-obra">${obras.map(o => `<option>${esc(o)}</option>`).join('')}</select>`;
  return `<div class="secao">
    <div class="secao-cab"><h2>💬 Recado para o Gustavo</h2><span class="qtd">${obra ? esc(obra) : 'escolha a obra'}</span></div>
    <div class="recado-form">${seletor}
      <textarea id="recadoTexto" rows="2" maxlength="1000" placeholder="Qualquer assunto da obra: NF que vai chegar, dúvida, aviso..."></textarea>
      <button class="btn sm primary" data-acao="recado">Enviar recado</button></div>
    ${lista.length ? `<div class="recado-lista">${lista.map(r => `<div class="recado-item"><span class="det">${esc(r.obra)}</span>${linhaResposta(r)}</div>`).join('')}</div>` : ''}
  </div>`;
}

function desenhar() {
  if (!dados) return;
  // guarda o que estava digitado (o redesenho não pode apagar)
  const digitado = {};
  document.querySelectorAll('#listas .oc-input, #listas .coment-input, #recadoTexto').forEach(el => { if (el.value) digitado[(el.className || el.id) + '|' + (el.dataset.id || '')] = el.value; });
  const abertos = [...document.querySelectorAll('#listas .linha-coment:not([hidden])')].map(tr => tr.dataset.coment);

  const busca = document.getElementById('busca').value.trim().toLowerCase();
  const obra = obraSel;
  desenharObras();
  const selLote = document.getElementById('fLote');
  const lotes = [...new Set((dados.itens || []).filter(i => !obra || i.obra === obra).map(i => i.envio).filter(Boolean))].sort().reverse();
  const loteAtual = lotes.includes(selLote.value) ? selLote.value : '';
  selLote.innerHTML = '<option value="">Todos os lotes</option>' + lotes.map(l => {
    const n = (dados.itens || []).filter(i => i.envio === l && (!obra || i.obra === obra));
    const p = n.filter(precisaResolver).length;
    return `<option value="${esc(l)}">Lote ${data(l)} — ${n.length} cobrança(s)${p ? `, ${p} pendente(s)` : ''}</option>`;
  }).join('');
  selLote.value = loteAtual;
  const itens = (dados.itens || []).filter(i =>
    (!obra || i.obra === obra) && (!loteAtual || i.envio === loteAtual) &&
    (!busca || `${i.fornecedor} ${i.numDoc} ${i.oc} ${i.obra}`.toLowerCase().includes(busca)));
  const pend = itens.filter(precisaResolver).sort((a, b) => ordemPend(a) - ordemPend(b) || String(a.vencimento).localeCompare(String(b.vencimento)));
  const aguard = itens.filter(aguardando).sort((a, b) => String(a.vencimento).localeCompare(String(b.vencimento)));
  const vinc = itens.filter(i => !precisaResolver(i) && i.vinculado);
  const vencidas = pend.filter(i => i.vencimento && i.vencimento < hoje());
  const soma = l => brl(l.reduce((s, i) => s + liquido(i), 0));
  document.getElementById('resumo').innerHTML = `
    <div class="card amber"><div class="rot">Precisa resolver</div><div class="val">${pend.length}</div><div class="sub">${soma(pend)}</div></div>
    <div class="card red"><div class="rot">Pendentes já vencidos</div><div class="val">${vencidas.length}</div><div class="sub">${soma(vencidas)}</div></div>
    <div class="card"><div class="rot">Aguardando vínculo</div><div class="val">${aguard.length}</div><div class="sub">${soma(aguard)}</div></div>
    <div class="card green"><div class="rot">Vinculadas</div><div class="val">${vinc.length}</div><div class="sub">${soma(vinc)}</div></div>`;
  const onde = (obra ? ' — ' + esc(obra) : '') + (loteAtual ? ' · lote ' + data(loteAtual) : '');
  document.getElementById('listas').innerHTML =
    tabela('⚠️ Precisa resolver' + onde, pend, obra ? 'Nada pendente nesta obra. 🎉' : 'Nada pendente nas suas obras. 🎉', !obra, true,
      '<b>Responda aqui mesmo:</b> digite o nº da OC e aperte <b>Enter</b> — vai direto para o Gustavo e o cursor pula para a próxima. Use <b>✓ OC liberada</b> quando a negativação foi aprovada e <b>💬</b> para qualquer outra informação.') +
    tabela('⏳ Aguardando vínculo' + onde, aguard, 'Nada aguardando vínculo.', !obra, false) +
    tabela('✓ Vinculadas' + onde, vinc, obra ? 'Nenhuma NF vinculada nesta obra ainda.' : 'Nenhuma NF vinculada ainda.', !obra, false) +
    secaoRecados(obra);

  // devolve o que estava digitado e os comentários abertos
  document.querySelectorAll('#listas .oc-input, #listas .coment-input, #recadoTexto').forEach(el => { const v = digitado[(el.className || el.id) + '|' + (el.dataset.id || '')]; if (v) el.value = v; });
  abertos.forEach(id => { const tr = document.querySelector(`#listas .linha-coment[data-coment="${CSS.escape(id)}"]`); if (tr) tr.hidden = false; });
}

// ---------- ENVIAR ----------
const ERROS = { pin: 'Seu acesso mudou. Entre de novo com o PIN.', bloqueado: 'Muitas tentativas. Aguarde 15 minutos.',
  oc: 'Digite o número da OC.', texto: 'Escreva o comentário.', limite: 'Muitas respostas em pouco tempo. Aguarde um pouco.',
  obra: 'Esta obra não está liberada para você.', lancamento: 'Este lançamento não existe mais. Clique em ↻ Atualizar.' };
async function enviarResposta(nfId, tipo, oc, texto, obra) {
  const { data: r, error } = await sb.rpc('engenheiro_responder', { p_pin: pinAtual, p_nf_id: nfId || null, p_tipo: tipo, p_oc: oc || null, p_texto: texto || null, p_obra: obra || null });
  if (error) throw new Error('Não consegui enviar agora. Confira a internet e tente de novo.');
  if (r.erro) { if (r.erro === 'pin' || r.erro === 'bloqueado') sair(ERROS[r.erro]); throw new Error(ERROS[r.erro] || 'Não consegui enviar.'); }
  dados.respostas = [{ id: r.id, nf_id: nfId || null, obra, tipo, oc: oc ? limparOC(oc) : null, texto: texto || null, status: 'nova', engenheiro: dados.nome, criado_em: new Date().toISOString() }, ...(dados.respostas || [])];
}
function toast(t, erro) {
  const el = document.getElementById('toast');
  el.textContent = t; el.className = 'toast show' + (erro ? ' erro' : '');
  clearTimeout(el._t); el._t = setTimeout(() => { el.className = 'toast'; }, erro ? 4500 : 2200);
}
const itemPorId = id => (dados.itens || []).find(i => i.id === id);

async function acaoClick(btn) {
  const acao = btn.dataset.acao, id = btn.dataset.id;
  if (acao === 'abrir-coment') {
    const tr = document.querySelector(`#listas .linha-coment[data-coment="${CSS.escape(id)}"]`);
    if (tr) { tr.hidden = !tr.hidden; if (!tr.hidden) tr.querySelector('textarea').focus(); }
    return;
  }
  if (acao === 'ver-nf') { abrirNF(id, btn); return; }
  if (btn.disabled) return;
  const it = id ? itemPorId(id) : null;
  let oc = null, texto = null, obra = it ? it.obra : null, proximo = null;
  if (acao === 'oc') {
    const inp = document.querySelector(`#listas .oc-input[data-id="${CSS.escape(id)}"]`);
    oc = limparOC(inp && inp.value);
    if (!oc) { toast('Digite o número da OC.', true); inp && inp.focus(); return; }
    const todos = [...document.querySelectorAll('#listas .oc-input')];
    proximo = (todos[todos.indexOf(inp) + 1] || {}).dataset?.id || null;
  } else if (acao === 'comentario') {
    const ta = document.querySelector(`#listas .coment-input[data-id="${CSS.escape(id)}"]`);
    texto = (ta && ta.value || '').trim();
    if (!texto) { toast('Escreva o comentário.', true); ta && ta.focus(); return; }
  } else if (acao === 'recado') {
    texto = (document.getElementById('recadoTexto').value || '').trim();
    obra = document.getElementById('recadoObra').value;
    if (!texto) { toast('Escreva o recado.', true); document.getElementById('recadoTexto').focus(); return; }
  } else if ((acao === 'liberada' || acao === 'resolvido') && !confirm(acao === 'liberada'
      ? `Confirmar para o Gustavo que a OC ${it && it.oc ? it.oc + ' ' : ''}já foi liberada (negativação aprovada)?`
      : 'Confirmar para o Gustavo que a apropriação já foi feita?')) return;
  btn.disabled = true;
  try {
    await enviarResposta(acao === 'recado' ? null : id, acao === 'recado' ? 'comentario' : acao, oc, texto, obra);
    if (acao === 'oc') { const inp = document.querySelector(`#listas .oc-input[data-id="${CSS.escape(id)}"]`); if (inp) inp.value = ''; }
    if (acao === 'comentario') { const ta = document.querySelector(`#listas .coment-input[data-id="${CSS.escape(id)}"]`); if (ta) ta.value = ''; const tr = document.querySelector(`#listas .linha-coment[data-coment="${CSS.escape(id)}"]`); if (tr) tr.hidden = true; }
    if (acao === 'recado') document.getElementById('recadoTexto').value = '';
    desenhar();
    toast(acao === 'oc' ? `✓ OC ${oc} enviada para o Gustavo` : '✓ Enviado para o Gustavo');
    if (proximo) { const n = document.querySelector(`#listas .oc-input[data-id="${CSS.escape(proximo)}"]`); if (n) n.focus(); }
  } catch (e) {
    btn.disabled = false;
    toast(e.message, true);
  }
}
document.addEventListener('click', ev => {
  const b = ev.target.closest('[data-acao]');
  if (b && document.getElementById('painel').contains(b)) { ev.preventDefault(); acaoClick(b); }
});
document.addEventListener('keydown', ev => {
  if (ev.key !== 'Enter') return;
  if (ev.target.classList && ev.target.classList.contains('oc-input')) {
    ev.preventDefault();
    const b = document.querySelector(`#listas [data-acao="oc"][data-id="${CSS.escape(ev.target.dataset.id)}"]`);
    if (b) acaoClick(b);
  } else if (ev.target.matches && ev.target.matches('.coment-input, #recadoTexto') && (ev.ctrlKey || ev.metaKey)) {
    ev.preventDefault();
    const b = ev.target.id === 'recadoTexto' ? document.querySelector('[data-acao="recado"]')
      : document.querySelector(`#listas [data-acao="comentario"][data-id="${CSS.escape(ev.target.dataset.id)}"]`);
    if (b) acaoClick(b);
  }
});

async function abrirNF(id, btn) {
  if (btn.disabled) return;
  // navegador sem visualizador de PDF (ex.: Chrome do Android): baixa com o nome certo em vez de abrir aba
  const semVisualizador = navigator.pdfViewerEnabled === false;
  const w = semVisualizador ? null : window.open('', '_blank');
  if (w) w.document.write('<p style="font:16px system-ui,sans-serif;padding:24px;color:#555">Abrindo a NF…</p>');
  btn.disabled = true;
  try {
    const { data: r, error } = await sb.rpc('engenheiro_anexo', { p_pin: pinAtual, p_nf_id: id });
    if (error) throw new Error('Não consegui abrir a NF agora. Tente de novo.');
    if (r.erro) {
      if (r.erro === 'pin' || r.erro === 'bloqueado') sair(ERROS[r.erro]);
      throw new Error({ sem_anexo: 'O Gustavo ainda não anexou o PDF desta cobrança.', resolvido: 'Esta cobrança já foi resolvida. Clique em ↻ Atualizar.' }[r.erro] || ERROS[r.erro] || 'Não consegui abrir a NF.');
    }
    const bin = atob(r.b64), u8 = new Uint8Array(bin.length);
    for (let k = 0; k < bin.length; k++) u8[k] = bin.charCodeAt(k);
    const url = URL.createObjectURL(new Blob([u8], { type: 'application/pdf' }));
    if (w && !w.closed) w.location.href = url;
    else { const a = document.createElement('a'); a.href = url; a.download = r.nome || 'NF.pdf'; document.body.append(a); a.click(); a.remove(); }
    setTimeout(() => URL.revokeObjectURL(url), 120000);
  } catch (e) {
    if (w && !w.closed) w.close();
    toast(e.message, true);
  } finally { btn.disabled = false; }
}

// quadro "Suas obras": um cartão por obra (clique para ver só ela) + "Todas"
function desenharObras() {
  const obras = dados.obras || [];
  const el = document.getElementById('obras');
  if (!obras.length) { el.innerHTML = '<div class="vazio" style="padding:0">Nenhuma obra liberada ainda. Fale com Suprimentos.</div>'; return; }
  const itens = dados.itens || [];
  const cartao = (o, titulo) => {
    const l = o ? itens.filter(i => i.obra === o) : itens;
    const pend = l.filter(precisaResolver), venc = pend.filter(i => i.vencimento && i.vencimento < hoje());
    const ag = l.filter(aguardando), vinc = l.filter(i => !precisaResolver(i) && i.vinculado);
    return `<button class="obra-card ${obraSel === o ? 'ativa' : ''}" data-o="${esc(o)}" onclick="escolherObra(this.dataset.o)">
      <span class="nome">${esc(titulo)}</span>
      <span class="linha-info">
        <span class="pill ${pend.length ? 'pend' : 'zero'}">${pend.length} para resolver</span>
        ${venc.length ? `<span class="pill venc">${venc.length} vencido(s)</span>` : ''}
        ${ag.length ? `<span class="pill zero">${ag.length} aguardando</span>` : ''}
        <span class="pill ${vinc.length ? 'ok' : 'zero'}">${vinc.length} vinculada(s)</span>
      </span>
      ${pend.length ? `<span class="tot">Pendente: ${brl(pend.reduce((s, i) => s + liquido(i), 0))} · mais antiga há ${Math.max(...pend.map(i => diasDesde(i.envio) || 0))} dia(s)</span>` : ''}
    </button>`;
  };
  el.innerHTML = (obras.length > 1 ? cartao('', 'Todas as obras') : '') + obras.map(o => cartao(o, o)).join('');
}

async function atualizar() {
  if (!pinAtual) return;
  try {
    const r = await consultar(pinAtual);
    if (r.erro) { sair(r.erro === 'bloqueado' ? 'Muitas tentativas. Aguarde 15 minutos.' : 'Seu acesso mudou. Entre de novo com o PIN.'); return; }
    abrirPainel(r);
  } catch (e) { alert(e.message); }
}

function sair(aviso) {
  dados = null; pinAtual = '';
  guardarPin('');
  clearTimeout(timerInativo);
  document.getElementById('painel').style.display = 'none';
  document.getElementById('telaPin').style.display = '';
  document.getElementById('temaPin').style.display = '';
  document.getElementById('pin').value = '';
  msg(typeof aviso === 'string' ? aviso : '');
  document.getElementById('pin').focus();
}

// sai sozinho depois de 30 minutos sem uso
function reiniciarInatividade() {
  clearTimeout(timerInativo);
  timerInativo = setTimeout(() => sair('Sessão encerrada por inatividade.'), INATIVO_MS);
}
['click', 'keydown', 'scroll', 'touchstart'].forEach(ev => document.addEventListener(ev, () => { if (dados) reiniciarInatividade(); }, { passive: true }));

// ---------- CONVITE ----------
let tokenConvite = '';
const msgConv = t => { document.getElementById('msgConv').textContent = t || ''; };
async function abrirConvite(token) {
  tokenConvite = token;
  document.getElementById('telaPin').style.display = 'none';
  document.getElementById('telaConvite').style.display = '';
  const { data: r, error } = await sb.rpc('ver_convite', { p_token: token });
  if (error || !r || r.erro) {
    document.getElementById('btnCriar').disabled = true;
    msgConv('Este link expirou ou já foi usado. Peça um novo a Suprimentos.');
    return;
  }
  document.getElementById('convOla').textContent = 'Olá, ' + String(r.nome || '').split(' ')[0] + '! Crie seu PIN';
  document.getElementById('novoPin').focus();
}
async function criarPin(ev) {
  ev.preventDefault();
  const p1 = document.getElementById('novoPin').value, p2 = document.getElementById('novoPin2').value;
  if (!/^\d{6}$/.test(p1)) { msgConv('O PIN precisa ter 6 números.'); return; }
  if (p1 !== p2) { msgConv('Os dois PINs não são iguais.'); return; }
  if (/^(\d)\1{5}$/.test(p1) || '0123456789'.includes(p1) || '9876543210'.includes(p1)) { msgConv('PIN fácil demais (ex.: 111111 ou 123456). Escolha outro.'); return; }
  const btn = document.getElementById('btnCriar');
  btn.disabled = true; msgConv('');
  const { data: r, error } = await sb.rpc('criar_pin_convite', { p_token: tokenConvite, p_pin: p1 });
  btn.disabled = false;
  if (error) { msgConv('Não consegui salvar agora. Tente de novo.'); return; }
  if (r.erro === 'em_uso') { msgConv('Esse PIN não pode ser usado. Escolha outro.'); return; }
  if (r.erro === 'bloqueado') { msgConv('Muitas tentativas. Aguarde 15 minutos.'); return; }
  if (r.erro) { msgConv('Este link expirou ou já foi usado. Peça um novo a Suprimentos.'); btn.disabled = true; return; }
  history.replaceState(null, '', location.pathname);
  document.getElementById('telaConvite').style.display = 'none';
  document.getElementById('telaPin').style.display = '';
  document.getElementById('pin').value = p1;
  document.getElementById('lembrar').checked = document.getElementById('lembrarConv').checked;
  await entrar();
}

// ---------- AO ABRIR ----------
(async () => {
  if (!sb) { msg('Página sem configuração. Avise Suprimentos.'); document.getElementById('btnEntrar').disabled = true; return; }
  const convite = new URLSearchParams(location.search).get('convite');
  if (convite) { await abrirConvite(convite); return; }
  // administrador já conectado neste aparelho: vai direto para o Controle
  try { const { data } = await sb.auth.getSession(); if (data && data.session) { location.replace('admin.html'); return; } } catch (e) {}
  const pin = lerPin();
  let lembrado = false; try { lembrado = !!localStorage.getItem(CHAVE_PIN); } catch (e) {}
  document.getElementById('lembrar').checked = lembrado || !pin;
  if (pin) { document.getElementById('pin').value = pin; await entrar(); }
  else document.getElementById('pin').focus();
})();
</script>
